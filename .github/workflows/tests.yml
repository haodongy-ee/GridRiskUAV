name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m gridriskuav.demo
      - run: python -m gridriskuav.sensitivity --replicates 1 --output-dir smoke-results
      - run: python -m gridriskuav.plots --runs smoke-results/runs.csv --output-dir smoke-results/figures
